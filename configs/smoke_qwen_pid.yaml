extends: base.yaml

# Ten-step engineering smoke test only. The small evaluation splits and relaxed
# degradation budget are not suitable for scientific capability claims.
project:
  name: pid-grpo-smoke-deepseek-r1-distill-qwen-1.5b
  output_dir: /root/autodl-tmp/GRPO/outputs/smoke-qwen-pid

safety:
  max_degradation_ratio: 0.25
  safe_ratio: 0.50
  warn_ratio: 0.80
  min_eval_samples: 64

control:
  mode: pid_kl
  eval_interval_optimizer_steps: 2
  beta: 0.04

training:
  enabled: true
  model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  model_revision: ad9f0ae0864d7fbcd1cd905e3c6c5b069cc8b562
  use_lora: true
  overwrite_output_dir: false
  max_steps: 10
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-6
  logging_steps: 1
  bf16: true
  tf32: true
  gradient_checkpointing: true
  max_prompt_length: 256
  max_completion_length: 512
  num_generations: 4
  temperature: 0.9

evaluation:
  batch_size: 8
  max_new_tokens: 512
