project:
  name: pid-grpo
  seed: 42
  output_dir: /root/autodl-tmp/GRPO/outputs

storage:
  root_dir: /root/autodl-tmp/GRPO
  cache_dir: /root/autodl-tmp/GRPO/.cache
  min_free_gb: 20

safety:
  max_degradation_ratio: 0.02
  safe_ratio: 0.50
  warn_ratio: 0.80
  hard_stop_enabled: true
  rollback_enabled: true
  # Mock-only minimum; derive the real value from score resolution/confidence bounds.
  min_eval_samples: 1

control:
  mode: pid_kl
  # Ki/Kd and smoothing are defined per control evaluation, so changing this
  # interval changes the closed-loop time scale and requires re-tuning.
  eval_interval_optimizer_steps: 50
  beta: 0.04
  fixed_beta: 0.04
  pid:
    # Gains, deadband and integral bounds use the normalized warn-to-hard interval.
    # They are scale-invariant initial values, not experimentally tuned optima.
    kp: 2.0
    ki: 0.2
    kd: 1.0
    beta_min: 0.001
    beta_max: 1.0
    max_beta_multiplier: 2.0
    ema_alpha: 0.4
    derivative_alpha: 0.5
    deadband: 0.0
    integral_min: 0.0
    integral_max: 0.10
    safe_integral_leak: 0.5
    safe_release_rate: 0.25
    warmup_control_steps: 1

training:
  enabled: false
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  model_revision: 7ae557604adf67be50417f59c2c2f167def9a775
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  overwrite_output_dir: false
  max_steps: 100
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-6
  logging_steps: 1
  bf16: true
  tf32: true
  gradient_checkpointing: true
  max_prompt_length: 512
  max_completion_length: 256
  num_generations: 4
  temperature: 0.9

data:
  train_file: /root/autodl-tmp/GRPO/data/train/train.jsonl
  control_file: /root/autodl-tmp/GRPO/data/control/control.jsonl
  domain_validation_file: /root/autodl-tmp/GRPO/data/domain_validation/domain_validation.jsonl
  final_test_file: /root/autodl-tmp/GRPO/data/final_test/final_test.jsonl

evaluation:
  batch_size: 4
  max_new_tokens: 128
